name: verify-engineering-software
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "${{ matrix.python }}"
      - run: python -m unittest discover -s tests -v
      - run: python -m dclink_lab demo --out outputs/ci
      - run: python engineering/ltspice_physical/validate_physical_package.py
