[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ev-dclink-lab"
version = "1.0.0"
description = "DC-link precharge, contactor supervisor, fault simulation and telemetry validation"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
dclink-lab = "dclink_lab.__main__:main"

[tool.setuptools.packages.find]
include = ["dclink_lab*"]
